<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Screen Time Counter</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app">
      <section class="capture-panel">
        <div class="topbar">
          <div>
            <h1>Screen Time Counter</h1>
            <p>Capture your entire screen and classify time as active, idle, or away from visual changes and page input.</p>
          </div>
          <div class="status-pill" id="statusPill">
            <span class="status-dot"></span>
            <span id="statusText">Ready</span>
          </div>
        </div>

        <div class="screen-wrap">
          <video id="screenVideo" autoplay playsinline muted></video>
          <canvas id="sampleCanvas" width="160" height="90" aria-hidden="true"></canvas>
          <div class="empty-state" id="emptyState">
            <strong>No screen shared yet</strong>
            <span>Start capture, then pick “Entire screen” in the browser dialog.</span>
          </div>
        </div>

        <div class="controls" aria-label="Capture controls">
          <button class="primary" id="startBtn" type="button">
            <span aria-hidden="true">▶</span>
            Start Capture
          </button>
          <button id="pauseBtn" type="button" disabled>
            <span aria-hidden="true">Ⅱ</span>
            Pause
          </button>
          <button id="stopBtn" type="button" disabled>
            <span aria-hidden="true">■</span>
            Stop
          </button>
          <button id="exportBtn" type="button" disabled>
            <span aria-hidden="true">↧</span>
            Export CSV
          </button>
        </div>
      </section>

      <aside class="metrics">
        <section class="summary" aria-label="Screen time summary">
          <div class="metric active">
            <span>Active</span>
            <strong id="activeTime">00:00:00</strong>
          </div>
          <div class="metric idle">
            <span>Idle</span>
            <strong id="idleTime">00:00:00</strong>
          </div>
          <div class="metric away">
            <span>Away</span>
            <strong id="awayTime">00:00:00</strong>
          </div>
          <div class="metric total">
            <span>Total</span>
            <strong id="totalTime">00:00:00</strong>
          </div>
        </section>

        <section class="settings" aria-label="Recognition settings">
          <h2>AFK Model</h2>
          <label>
            <span>Idle after no activity</span>
            <output id="idleOutput">60s</output>
            <input id="idleAfter" type="range" min="10" max="300" step="5" value="60">
          </label>
          <label>
            <span>Away after no activity</span>
            <output id="awayOutput">180s</output>
            <input id="awayAfter" type="range" min="30" max="900" step="10" value="180">
          </label>
          <label>
            <span>Screen-change sensitivity</span>
            <output id="sensitivityOutput">18</output>
            <input id="sensitivity" type="range" min="4" max="50" step="1" value="18">
          </label>
          <label class="toggle">
            <input id="autoPauseHidden" type="checkbox" checked>
            <span>Pause timer when this tab is hidden</span>
          </label>
        </section>

        <section class="timeline" aria-label="Activity timeline">
          <div class="section-head">
            <h2>Timeline</h2>
            <button id="clearBtn" type="button" disabled>Clear</button>
          </div>
          <ol id="timelineList"></ol>
        </section>
      </aside>
    </main>

    <script src="app.js"></script>
  </body>
</html>
